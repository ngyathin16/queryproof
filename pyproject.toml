[project]
name = "queryproof"
version = "0.1.0"
description = "A local SQL metric review workbench with reproducible evidence"
requires-python = ">=3.12,<3.15"
dependencies = ["duckdb==2.0.0", "sqlglot==30.31.0"]

[project.scripts]
queryproof = "queryproof.server:main"

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["queryproof"]
